[project]
name = "self-healing-pixels"
version = "0.1.0"
description = "Neural cellular automata that grow an emoji from one pixel and heal when cut. Trained in PyTorch, runs in the browser."
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.0",
]

[project.scripts]
train = "self_healing_pixels.train:main"
animate = "self_healing_pixels.animate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
